name: Regenerate develop profile outputs

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/regenerate-develop.yaml"
      - "assets/profile-banner.svg"
      - "portfolio/profile.json"
      - "schemas/profile.schema.json"
      - "scripts/render_profile_readme.py"
      - "scripts/render_public_activity.py"
      - "scripts/validate_local_links.py"
      - "scripts/validate_repository.py"
      - "tests/test_render_profile.py"
      - "tests/test_public_commit_activity.py"
      - "tests/test_local_links.py"

permissions:
  contents: write

concurrency:
  group: regenerate-develop-profile
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: develop
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Regenerate deterministic outputs
        run: python scripts/portfolio_ci.py update
      - name: Run complete quality gate
        run: python scripts/portfolio_ci.py final-check
      - name: Commit generated outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/public-activity.svg docs/PROOF_ASSET_REPORT.md docs/GENERATED_UPDATE_SUMMARY.md
          if git diff --cached --quiet; then
            echo "Generated outputs already current."
            exit 0
          fi
          git commit -m "chore(profile): regenerate banner and activity outputs"
          git push origin HEAD:develop
