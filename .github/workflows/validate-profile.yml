name: Validate special profile

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "portfolio/**"
      - "case-studies/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - "docs/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run final profile quality gate
        run: python scripts/portfolio_ci.py final-check
