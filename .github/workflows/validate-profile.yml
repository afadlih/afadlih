name: Validate special profile

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "portfolio/**"
      - "case-studies/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - "docs/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run final profile quality gate
        run: python scripts/portfolio_ci.py final-check
