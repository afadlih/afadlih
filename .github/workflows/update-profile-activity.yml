name: Refresh public repository activity

on:
  workflow_dispatch:
  schedule:
    # Monday 06:17 WIB / Sunday 23:17 UTC.
    - cron: "17 23 * * 0"
  push:
    branches: [main]
    paths:
      - "portfolio/activity-sources.json"
      - "scripts/update_repository_activity.py"
      - ".github/workflows/update-profile-activity.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Configure update branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="automation/profile-activity"
          git checkout -B "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Refresh allowlisted public repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repository_activity.py --write

      - name: Regenerate and validate profile
        run: |
          python scripts/portfolio_ci.py update
          python scripts/portfolio_ci.py final-check

      - name: Detect meaningful changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- README.md portfolio/repository-activity.json docs/PROOF_ASSET_REPORT.md docs/GENERATED_UPDATE_SUMMARY.md)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No public activity changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Commit and push update branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add README.md portfolio/repository-activity.json docs/PROOF_ASSET_REPORT.md docs/GENERATED_UPDATE_SUMMARY.md
          git commit -m "chore(profile): refresh public repository activity"
          git push --force-with-lease origin "$BRANCH"

      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --title "chore(profile): refresh public repository activity" \
              --body-file docs/GENERATED_UPDATE_SUMMARY.md
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(profile): refresh public repository activity" \
              --body-file docs/GENERATED_UPDATE_SUMMARY.md
          fi
