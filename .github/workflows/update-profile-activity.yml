name: Refresh public profile activity

on:
  workflow_dispatch:
  create:
  schedule:
    # Daily at 06:17 WIB / 23:17 UTC.
    - cron: "17 23 * * *"
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-profile-activity
  cancel-in-progress: true

jobs:
  enforce-branch-policy:
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Keep only main and develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATED_BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          case "$CREATED_BRANCH" in
            main|develop)
              echo "Persistent branch allowed: $CREATED_BRANCH"
              ;;
            *)
              echo "Deleting non-persistent branch: $CREATED_BRANCH"
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/git/refs/heads/$CREATED_BRANCH"
              ;;
          esac

  update:
    if: github.event_name != 'create'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Prepare current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin main develop
          git checkout -B main origin/main
          echo "BASE_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Remove stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            case "$branch" in
              main|develop)
                ;;
              *)
                echo "Deleting stale branch: $branch"
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
                ;;
            esac
          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
              --jq '.[].name'
          )

      - name: Refresh allowlisted public repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repository_activity.py --write

      - name: Refresh bounded public commit sample
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_public_commit_activity.py --write

      - name: Regenerate repository-owned visuals and README
        run: python scripts/portfolio_ci.py update

      - name: Run final profile quality gate
        run: python scripts/portfolio_ci.py final-check

      - name: Detect meaningful generated changes
        id: diff
        run: |
          TRACKED_PATHS=(
            README.md
            portfolio/repository-activity.json
            portfolio/public-commit-activity.json
            assets/public-activity.svg
            docs/PROOF_ASSET_REPORT.md
            docs/GENERATED_UPDATE_SUMMARY.md
          )
          if [ -z "$(git status --porcelain -- "${TRACKED_PATHS[@]}")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No public activity changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- "${TRACKED_PATHS[@]}"
          fi

      - name: Commit and fast-forward main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add \
            README.md \
            portfolio/repository-activity.json \
            portfolio/public-commit-activity.json \
            assets/public-activity.svg \
            docs/PROOF_ASSET_REPORT.md \
            docs/GENERATED_UPDATE_SUMMARY.md
          git commit -m "chore(profile): refresh public activity assets"

          git fetch origin main
          CURRENT_REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_REMOTE_SHA" != "$BASE_SHA" ]; then
            echo "::error::main moved during generation; refusing a stale update. Re-run the workflow."
            exit 1
          fi

          # A normal fast-forward push only. Never force-push the profile branch.
          git push origin HEAD:main

      - name: Fast-forward develop when safe
        run: |
          set -euo pipefail
          git fetch origin main develop
          git reset --hard origin/main
          if git merge-base --is-ancestor origin/develop HEAD; then
            git push origin HEAD:develop
            echo "develop synchronized with main."
          else
            echo "::warning::develop contains work not present in main; leaving it unchanged."
          fi
