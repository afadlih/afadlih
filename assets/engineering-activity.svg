    <text x="109.86" y="495" text-anchor="middle" class="axis">FEB 07–28</text>
    <text x="109.86" y="456.27" text-anchor="middle" class="bar-value">2</text>
    <text x="217.57" y="495" text-anchor="middle" class="axis">MAR</text>
    <text x="325.29" y="495" text-anchor="middle" class="axis">APR</text>
    <text x="325.29" y="426.44" text-anchor="middle" class="bar-value">18</text>
