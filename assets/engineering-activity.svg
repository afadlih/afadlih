  <line x1="850" y1="232" x2="1140" y2="232" stroke="#334155" stroke-width="1"/>
    <text x="850" y="270" class="repo">1. AquaSense</text>
    <text x="1138" y="270" text-anchor="end" class="repo-count">118 commits</text>
