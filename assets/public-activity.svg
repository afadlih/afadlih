<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Public and sanitized private engineering activity for afadlih</title>
  <desc id="desc">Public authored-commit bars plus a privacy-reviewed snapshot of private project names and latest activity dates.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
