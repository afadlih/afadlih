<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Ahmad Fadlih — Full-Stack and AI Engineering</title>
  <desc id="desc">Animated profile banner with engineering systems, AI workflow, and IoT motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#2dd4bf;#818cf8;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#2dd4bf;#818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="26" fill="url(#grid)"/>
  <circle cx="980" cy="110" r="230" fill="url(#glow)">
    <animate attributeName="r" values="190;245;190" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="320" r="170" fill="url(#glow)" opacity="0.35"/>

  <g opacity="0.75" stroke="url(#accent)" fill="none" stroke-width="2">
    <path d="M760 85 C840 25 930 34 1000 91 S1110 173 1165 120" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M735 235 C820 175 895 274 980 212 S1100 190 1160 246" stroke-dasharray="5 12">
      <animate attributeName="stroke-dashoffset" from="0" to="170" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="802" cy="74" r="7" fill="#38bdf8"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="931" cy="78" r="7" fill="#2dd4bf"><animate attributeName="opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1058" cy="139" r="7" fill="#818cf8"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="817" cy="226" r="7" fill="#818cf8"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="212" r="7" fill="#38bdf8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1127" cy="224" r="7" fill="#2dd4bf"><animate attributeName="opacity" values="1;0.4;1" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="92" fill="#e2e8f0" font-size="20" font-weight="600" letter-spacing="3">FULL-STACK • AI • SYSTEM INTEGRATION</text>
    <text x="60" y="162" fill="#f8fafc" font-size="48" font-weight="800">Ahmad Fadlih</text>
    <rect x="62" y="184" width="560" height="5" rx="3" fill="url(#accent)">
      <animate attributeName="width" values="210;560;390;560" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="64" y="229" fill="#cbd5e1" font-size="23" font-weight="500">Engineering reliable products from complex workflows.</text>
    <text x="64" y="271" fill="#94a3b8" font-size="17">AI workflows  /  on-premise IoT  /  operational full-stack systems</text>
    <text x="64" y="305" fill="#38bdf8" font-size="15" font-weight="700">BUILD • VALIDATE • OBSERVE • DOCUMENT</text>
    <rect x="463" y="289" width="10" height="22" rx="2" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(815 105)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="128" height="62" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="64" y="27" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">AI FLOW</text>
    <text x="64" y="47" text-anchor="middle" fill="#94a3b8" font-size="11">validate + review</text>
    <rect x="165" y="76" width="128" height="62" rx="12" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="229" y="103" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">IOT EDGE</text>
    <text x="229" y="123" text-anchor="middle" fill="#94a3b8" font-size="11">MQTT + device state</text>
    <rect x="0" y="152" width="128" height="62" rx="12" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.55"/>
    <text x="64" y="179" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">FULL STACK</text>
    <text x="64" y="199" text-anchor="middle" fill="#94a3b8" font-size="11">product + operations</text>
    <path d="M128 31 C170 31 150 88 165 100" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-55" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M165 118 C145 150 165 182 128 182" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 6">
      <animate attributeName="stroke-dashoffset" from="0" to="55" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="25" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>
</svg>
