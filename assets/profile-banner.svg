<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Ahmad Fadlih Wahyu Sardana — Full-Stack, AI, and System Integration</title>
  <desc id="desc">Animated profile banner with a clean left-to-right engineering flow from AI workflow to full-stack core and IoT edge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#2dd4bf;#818cf8;#38bdf8" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#818cf8"><animate attributeName="stop-color" values="#818cf8;#38bdf8;#2dd4bf;#818cf8" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="26" fill="url(#grid)"/>
  <circle cx="1000" cy="165" r="220" fill="url(#glow)"><animate attributeName="r" values="188;230;188" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.62;1;0.62" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="105" cy="320" r="165" fill="url(#glow)" opacity="0.3"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="88" fill="#e2e8f0" font-size="19" font-weight="600" letter-spacing="2.8">FULL-STACK • AI • SYSTEM INTEGRATION</text>
    <text x="60" y="158" fill="#f8fafc" font-size="38" font-weight="800">Ahmad Fadlih Wahyu Sardana</text>
    <rect x="62" y="181" width="610" height="5" rx="3" fill="url(#accent)"><animate attributeName="width" values="245;610;430;610" dur="7s" repeatCount="indefinite"/></rect>
    <text x="64" y="225" fill="#cbd5e1" font-size="22" font-weight="500">Engineering reliable products from complex workflows.</text>
    <text x="64" y="267" fill="#94a3b8" font-size="17">AI workflows  /  on-premise IoT  /  operational full-stack systems</text>
    <text x="64" y="303" fill="#38bdf8" font-size="15" font-weight="700">BUILD • VALIDATE • OBSERVE • DOCUMENT</text>
    <rect x="463" y="287" width="10" height="22" rx="2" fill="#38bdf8"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <g transform="translate(742 112)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="211" y="-30" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.8">ENGINEERING FLOW</text>
    <path d="M128 31H150" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M278 31H300" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.6s" begin="0.35s" repeatCount="indefinite"/></path>
    <g><rect x="0" y="0" width="128" height="62" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.62"/><text x="64" y="27" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">AI FLOW</text><text x="64" y="47" text-anchor="middle" fill="#94a3b8" font-size="11">validate + review</text></g>
    <g><rect x="150" y="0" width="128" height="62" rx="12" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.62"/><text x="214" y="27" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">FULL STACK</text><text x="214" y="47" text-anchor="middle" fill="#94a3b8" font-size="11">product + operations</text></g>
    <g><rect x="300" y="0" width="128" height="62" rx="12" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.62"/><text x="364" y="27" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">IOT EDGE</text><text x="364" y="47" text-anchor="middle" fill="#94a3b8" font-size="11">MQTT + device state</text></g>
    <line x1="18" y1="100" x2="410" y2="100" stroke="#334155" stroke-width="1"/>
    <g filter="url(#softGlow)"><circle cx="32" cy="100" r="5" fill="#38bdf8"><animate attributeName="cx" values="32;214;396;32" dur="5.4s" repeatCount="indefinite"/><animate attributeName="fill" values="#38bdf8;#818cf8;#2dd4bf;#38bdf8" dur="5.4s" repeatCount="indefinite"/></circle></g>
    <text x="214" y="133" text-anchor="middle" fill="#64748b" font-size="11">INPUT → VALIDATION → EXECUTION → OBSERVABILITY</text>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="25" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>
</svg>
