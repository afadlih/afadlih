  <text x="60" y="190" class="body">1. collect topic, platform, audience, tone</text><text x="60" y="228" class="body">2. generate emotional / educational / viral strategies</text><text x="60" y="266" class="body">3. normalize response into stable data shape</text><text x="60" y="304" class="body">4. score, compare, and recommend the strongest option</text><text x="60" y="342" class="body">5. output caption, hashtags, and future plan</text>
